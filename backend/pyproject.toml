[project]
name = "recruiting-backend"
version = "0.1.0"
description = "Consent-first applicant assessment: backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic>=2.7",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
dev-dependencies = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs a real PostgreSQL at TEST_DATABASE_URL (skipped otherwise)"]
