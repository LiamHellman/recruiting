# Deterministic GitHub evidence: names found in a repository -> canonical skill ids.
#
# A dependency, Docker image or file extension listed here is evidence for the skill
# (`demonstrated` in the candidate's own repos, `deep` via merged PRs to others' repos).
# Anything not listed is ignored, never guessed: no fuzzy matching and no lookups of package
# names in the alias table (npm's `rest` package is not REST API design).
# Like aliases, these feed scoring: a human approves every addition.
#
# pypi:   PEP 503-normalized names (lowercase, runs of -_. become -). `prefix-*` matches a family.
# npm:    exact names; `@scope/*` matches a scope.
# go:     module paths; a module matches its own path and any path below it (/v2, ...).
# maven:  groupId:artifactId; `groupId:*` matches the group.
# images: Docker image names without registry, tag or digest (docker.io/library/ dropped).
# extensions: file extension -> language, for files changed in merged PRs and for picking a
#         file to cite for a repo's language.

