# Canonical skills, backend roles first.
#
# id:     skill:<slug>, lowercase. Never rename an id once evidence references it.
# name:   display name; also matched as an alias.
# parent: optional broader skill (fastapi -> python-web-framework).
# group:  true for umbrella skills such as "relational database". Postings can ask for
#         them; evidence for a child counts in full (app/scoring/scorer.py).
#
# Nothing is added here automatically. Unknown posting terms stay unmapped until a human
# adds or maps them.

skills:
  # Umbrella skills
  - {id: skill:programming-language, name: Programming language, group: true}
  - {id: skill:python-web-framework, name: Python web framework, group: true}
